[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oept"
version = "0.1.0"
description = "Open Evidence Provenance Toolkit: content-addressed evidence objects, portable signed bundles, offline verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OEPT Contributors" }]
keywords = ["provenance", "supply-chain", "integrity", "verification", "evidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=41",
    "jcs>=0.2",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.8",
]
test = [
    "pytest>=8",
]

[project.scripts]
oept = "oept.cli:main"

[project.urls]
Homepage = "https://example.invalid/oept"
Repository = "https://example.invalid/oept"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oept = ["py.typed", "data/schemas/*.json", "data/conformance/*/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
show_error_codes = true

# Third-party packages without type stubs. Our own code stays strict;
# only the untyped boundary is silenced (standard practice).
[[tool.mypy.overrides]]
module = ["jcs.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
