name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests conformance/make_fixtures.py
      - name: Format
        run: ruff format --check src tests conformance/make_fixtures.py
      - name: Typecheck
        run: mypy src/oept
      - name: Unit tests
        run: pytest tests/ -q
      - name: Schema validation
        run: python -m oept.cli schema list
      - name: Conformance
        run: python -m oept.cli conformance
