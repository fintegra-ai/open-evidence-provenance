name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests conformance/make_fixtures.py
      - name: Format
        run: ruff format --check src tests conformance/make_fixtures.py
      - name: Typecheck
        run: mypy src/oept
      - name: Unit tests
        run: pytest tests/ -q
      - name: Schema validation
        run: python -m oept.cli schema list
      - name: Conformance
        run: python -m oept.cli conformance

  secrets:
    # Faz A (NLnet plan v2): secret scanning is a boundary rule, not a best
    # effort. The pinned gitleaks binary scans the full git history on every
    # push and every PR; .gitleaks.toml at the repo root carries the single,
    # justified allowlist entry (the documented test-only conformance key).
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned release, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan full git history (any finding fails the job)
        run: ./gitleaks detect --source . --report-format json --report-path gitleaks-report.json --redact --exit-code 1
